<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Wanderlust Tours</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-layout">
    <aside class="auth-hero" aria-hidden="true">
      <div class="auth-hero-content">
        <h1>Welcome Back, Explorer!</h1>
        <p>Sign in to access your personalized travel dashboard and continue planning your next adventure.</p>
        <ul class="auth-hero-features">
          <li>View saved destinations</li>
          <li>Manage your bookings</li>
          <li>Get member-only offers</li>
        </ul>
      </div>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-card-header">
          <div class="auth-logo"><span>&#9992;</span> Wanderlust Tours</div>
          <h2>Sign In</h2>
          <p>Enter your credentials to continue</p>
        </div>

        <div id="formAlert" class="alert" role="alert"></div>

        <form id="signinForm" novalidate>
          <div class="form-group">
            <label for="email">Email <span class="required">*</span></label>
            <input type="email" id="email" name="email" class="form-control" placeholder="example@mail.com" required autocomplete="email">
            <span id="emailError" class="error-message" role="alert"></span>
          </div>

          <div class="form-group">
            <label for="password">Password <span class="required">*</span></label>
            <div class="input-wrapper">
              <input type="password" id="password" name="password" class="form-control has-toggle" placeholder="Enter your password" required autocomplete="current-password">
              <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">&#128584;</button>
            </div>
            <span id="passwordError" class="error-message" role="alert"></span>
          </div>

          <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/signin.js"></script>
</body>
</html>
